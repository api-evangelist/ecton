name: Ecton
description: >-
  Ecton, Inc. is an AI-powered patient payments platform focused on reducing the
  financial stress and financial toxicity that surround healthcare costs. Its
  flagship product, Toni, is an AI financial counselor that gives patients
  personalized guidance on medical bills, insurance, and payment options, paired
  with a Health Savings and Spending Wallet for managing and paying healthcare
  expenses. Ecton helps healthcare providers strengthen patient relationships,
  improve treatment adherence, and increase revenue collection. The company is
  HIPAA-aligned and backed by General Catalyst. Ecton does not currently publish
  a public developer API or documentation surface; this profile captures its
  identity and public security posture.
